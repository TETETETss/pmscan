name: scan-and-deploy
on:
  schedule:
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: scan-deploy
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Scan and build
        id: build
        run: |
          if timeout 600 python3 scan.py; then
            n=$(python3 -c "import json;print(len(json.load(open('data/wallets.json.new'))['wallets']))")
            echo "wallets: $n"
            if [ "$n" -ge 50 ]; then mv data/wallets.json.new data/wallets.json; mv data/history.json.new data/history.json; python3 build.py && echo "ok=1" >> $GITHUB_OUTPUT
            else echo "Too few wallets ($n), keeping old data"; echo "ok=0" >> $GITHUB_OUTPUT; fi
          else echo "Scan failed, keeping old data"; echo "ok=0" >> $GITHUB_OUTPUT; fi
          rm -f data/*.new
      - name: Deploy to Cloudflare Pages
        if: steps.build.outputs.ok == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 pages deploy pub --project-name pmscan --branch main --commit-dirty=true
      - name: Commit data back
        if: steps.build.outputs.ok == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wallets.json data/history.json pub/index.html
          git diff --cached --quiet && exit 0
          git commit -m "scan $(date -u '+%F %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 5; done
